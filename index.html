<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thoresen Media</title>
<meta name="description" content="Thoresen Media AB. All things creative. Games, films and novels.">
<link rel="canonical" href="https://thoresenmedia.com/">
<meta property="og:title" content="Thoresen Media">
<meta property="og:description" content="All things creative. Games / Films / Novels">
<meta property="og:url" content="https://thoresenmedia.com/">
<meta property="og:type" content="website">
<style>
  :root {
    --bg: #0e0f12;
    --ink: #f2efe8;
    --dim: #8d8a83;
    --line: #2a2b30;
    --accent: #e0b25c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  header, footer {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 1.75rem clamp(1.5rem, 6vw, 4rem);
  }
  header { color: var(--ink); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2rem clamp(1.5rem, 6vw, 4rem);
    max-width: 62rem;
  }
  h1 {
    font-weight: 400;
    font-size: clamp(2.75rem, 9vw, 6.5rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .fields {
    margin-top: clamp(1.5rem, 4vw, 2.5rem);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: clamp(0.95rem, 2.2vw, 1.15rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .fields span { color: var(--line); padding: 0 0.5em; }
  .contact {
    margin-top: clamp(2.5rem, 7vw, 4.5rem);
    font-size: clamp(1.1rem, 2.6vw, 1.4rem);
  }
  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 0.15em;
  }
  a:hover, a:focus-visible { color: var(--accent); outline: none; }
  footer {
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 2rem;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <header>Thoresen Media</header>
  <main>
    <h1>All things <em>creative.</em></h1>
    <p class="fields">Games<span>/</span>Films<span>/</span>Novels</p>
    <p class="contact"><a href="mailto:contact@thoresenmedia.com">contact@thoresenmedia.com</a></p>
  </main>
  <footer>
    <span>Thoresen Media AB</span>
    <span>Org.nr 559325-4625</span>
    <span>Registered office: Uppsala, Sweden</span>
    <span>&copy; 2026</span>
  </footer>
</body>
</html>
